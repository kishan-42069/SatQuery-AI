[project]
name = "satquery-ai"
version = "0.1.0"
description = "Agentic AI-powered vision-language assistant for remote-sensing imagery."
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "python-multipart==0.0.12",
    "websockets==13.1",
    "httpx==0.27.2",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "python-dotenv==1.0.1",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "psycopg2-binary==2.9.10",
    "geoalchemy2==0.15.2",
    "alembic==1.13.3",
    "redis==5.1.1",
    "langgraph==0.2.35",
    "langchain==0.3.3",
    "langchain-core==0.3.12",
    "langchain-openai==0.2.3",
    "torch==2.4.1",
    "torchvision==0.19.1",
    "transformers==4.45.2",
    "accelerate==0.34.2",
    "sentencepiece==0.2.0",
    "opencv-python-headless==4.10.0.84",
    "Pillow==10.4.0",
    "numpy==2.0.2",
    "scipy==1.14.1",
    "rasterio==1.3.11",
    "geopandas==1.0.1",
    "shapely==2.0.6",
    "pyproj==3.6.1",
    "fiona==1.10.1",
    "structlog==24.4.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.black]
line-length = 120
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 120
